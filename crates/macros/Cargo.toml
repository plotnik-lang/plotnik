[package]
name = "plotnik-macros"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Proc-macro backend for plotnik - compile tree-sitter queries to typed Rust"
documentation = "https://docs.rs/plotnik-macros"
readme = "../../README.md"
keywords = ["tree-sitter", "query", "syntax-tree", "proc-macro"]
categories = ["development-tools", "parsing"]
include = ["src/**/*", "Cargo.toml"]

[lints]
workspace = true

[lib]
proc-macro = true

[features]

[dependencies]
cargo_metadata = "0.23"
crc32fast = "1.4"
litrs = "1.0"
plotnik-compiler = { path = "../compiler", version = "0.4.0", default-features = false }
plotnik-runtime = { path = "../runtime", version = "0.4.0", default-features = false }
serde_json = "1"
