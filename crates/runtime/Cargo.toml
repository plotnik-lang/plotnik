[package]
name = "plotnik-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared runtime engine for Plotnik queries"
documentation = "https://docs.rs/plotnik-runtime"
readme = "../../README.md"
keywords = ["tree-sitter", "query", "syntax-tree", "parser"]
categories = ["parsing", "development-tools"]

[lints]
workspace = true

[features]
default = ["execution"]
execution = ["dep:tree-sitter", "dep:tree-sitter-language"]
failpoints = []

[dependencies]
regex-automata = { version = "0.4", features = ["dfa-search"] }
serde = { version = "1", optional = true }
tree-sitter = { version = "=0.27.0", optional = true }
tree-sitter-language = { version = "0.1", optional = true }

[build-dependencies]
cc = "1.2"
