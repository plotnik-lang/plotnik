[package]
name = "plotnik"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Typed tree-sitter queries: the query! macro and its runtime"
documentation = "https://docs.rs/plotnik"
readme = "../../README.md"
keywords = ["tree-sitter", "query", "syntax-tree", "parser"]
categories = ["development-tools", "parsing"]
include = ["src/**/*", "Cargo.toml"]

[lints]
workspace = true

[features]
wasm = ["dep:plotnik-compiler", "plotnik-compiler/wasm"]

[dependencies]
plotnik-macros = { path = "../macros", version = "0.4.0" }
plotnik-runtime = { path = "../runtime", version = "0.4.0" }
plotnik-compiler = { path = "../compiler", version = "0.4.0", default-features = false, optional = true }

[dev-dependencies]
plotnik-runtime = { path = "../runtime", version = "0.4.0", features = ["failpoints"] }
tree-sitter-javascript = "0.25.0"
