[package]
name = "plotnik-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI for Plotnik, a typed query language for Tree-sitter syntax trees"
documentation = "https://docs.rs/plotnik-cli"
keywords = ["tree-sitter", "query", "syntax-tree", "parser", "cli"]
categories = ["command-line-utilities", "development-tools"]
readme = "../../README.md"
include = ["src/**/*", "Cargo.toml"]

[lints]
workspace = true

[[bin]]
name = "plotnik"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "string"] }
clap_complete = "4.5"
plotnik-lib = { path = "../plotnik-lib", version = "0.4.0", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
