[package]
name = "plotnik-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "WebAssembly bindings for Plotnik"
publish = false
include = ["src/**/*", "build.rs", "grammars.rs", "Cargo.toml"]

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[features]
default = ["lang-javascript", "lang-typescript"]
lang-javascript = ["dep:tree-sitter-javascript", "dep:tree-sitter-language"]
lang-typescript = ["dep:tree-sitter-typescript", "dep:tree-sitter-language"]

[dependencies]
plotnik-lib.workspace = true
serde = { version = "1.0.228", default-features = false }
serde-wasm-bindgen = "0.6"
serde_json = "1"
tree-sitter = "0.27.0"
tree-sitter-language = { version = "0.1.8", optional = true }
wasm-bindgen = "0.2"

[build-dependencies]
cargo_metadata = "0.23"
cc = "1.2"
tree-sitter-javascript = { version = "0.25.0", optional = true }
tree-sitter-typescript = { version = "0.23.2", optional = true }
