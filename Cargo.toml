[workspace]
resolver = "2"
members = [
    "crates/plotnik",
    "crates/cli",
    "crates/compiler",
    "crates/macros",
    "crates/runtime",
    "crates/tests",
    "crates/web",
]
[workspace.package]
version = "0.4.0"
license = "Apache-2.0"
repository = "https://github.com/plotnik-lang/plotnik"
edition = "2024"

[workspace.dependencies]
plotnik-compiler = { path = "crates/compiler", version = "0.4.0" }
plotnik-runtime = { path = "crates/runtime", version = "0.4.0" }

[workspace.lints.clippy]
unwrap_used = "deny"

# Keep arithmetic overflow/underflow loud in release, not just debug: a wrap that
# breaks an internal invariant must crash (the same discipline as panic!/.expect()),
# never silently corrupt downstream offsets/indices.
[profile.release]
overflow-checks = true
lto = "thin"
codegen-units = 1

# Benches inherit release; line tables let profilers (samply, Instruments)
# symbolicate the inlined hot loop at zero runtime cost.
[profile.bench]
debug = "line-tables-only"
