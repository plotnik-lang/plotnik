[workspace]
resolver = "2"
default-members = ["crates/cli"]
members = [
    "crates/plotnik",
    "crates/cli",
    "crates/compiler",
    "crates/macros",
    "crates/runtime",
    "crates/tests",
    "crates/tests/grammars/groups",
    "crates/web",
]
[workspace.package]
version = "0.4.0"
license = "Apache-2.0"
repository = "https://github.com/plotnik-lang/plotnik"
edition = "2024"

[workspace.dependencies]
plotnik-compiler = { path = "crates/compiler", version = "0.4.0" }
plotnik-runtime = { path = "crates/runtime", version = "0.4.0" }

[workspace.lints.clippy]
unwrap_used = "deny"

[profile.release]
overflow-checks = true
lto = "thin"
codegen-units = 1

[profile.bench]
debug = "line-tables-only"
